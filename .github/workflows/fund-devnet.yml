name: Fund a devnet test wallet

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fund-devnet.yml
  workflow_dispatch:
    inputs:
      address:
        description: Public Solana devnet wallet address
        required: true
        type: string
      sol:
        description: Valueless devnet SOL to request (maximum 0.1)
        required: true
        default: "0.05"
        type: string

permissions:
  contents: read

jobs:
  request-airdrop:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fund-devnet]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Request and verify airdrop
        env:
          DEVNET_WALLET: ${{ inputs.address || 'ArP2zkYmAztx337pzujDBu4J1pYPeHo451C7b76T449P' }}
          DEVNET_SOL: ${{ inputs.sol || '0.05' }}
        run: node scripts/fund-devnet.mjs
